# ALLEEN VOOR LOKALE STAGING (Docker). Zie docs/LOCAL_STAGING.md.
# Gebruikte CLI: supabase 3.1.0 (npx supabase@3.1.0 ...).
# Bevat bewust géén project-ref, URL's, API-keys of secrets. `supabase link` en
# `supabase db push` worden hiervoor niet gebruikt; deze configuratie raakt productie niet.

project_id = "samen-thuis-staging"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Gepind: de repo-tests (migrations-pg.test.js) ondersteunen PostgreSQL 14-16.
major_version = 15

[db.migrations]
enabled = true

# Draait NA de migraties bij `supabase db reset` (en bij de eerste `supabase start`).
# Laadt het legacy-basisschema (household_data + anon-policies). De migraties verwijzen
# alleen op runtime naar die tabel (plpgsql-body), niet bij het aanmaken.
# LET OP: nooit `supabase db push --include-seed` tegen een echt project gebruiken.
[db.seed]
enabled = true
sql_paths = ["./schema.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
# Lokaal geen e-mailbevestiging nodig; productie-instelling is onbekend (P) en wordt hier niet bepaald.
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
